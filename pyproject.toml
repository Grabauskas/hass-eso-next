[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/eso"]
omit = [
    "custom_components/eso/__init__.py",
    "custom_components/eso/account.py",
    "custom_components/eso/config_flow.py",
]

[tool.coverage.report]
show_missing = true
